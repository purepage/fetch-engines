name: Live Browser Evals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/live-browser-evals.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/eval-auto-render.mjs"
      - "scripts/run-live-browser-smoke.mjs"
      - "src/**"
      - "test/live/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/live-browser-evals.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/eval-auto-render.mjs"
      - "scripts/run-live-browser-smoke.mjs"
      - "src/**"
      - "test/live/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_CDP_ENDPOINT: ${{ secrets.LIVE_CDP_ENDPOINT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome Stable
        run: pnpm exec playwright install --with-deps chrome

      - name: Build project
        run: pnpm build

      - name: Run general live browser smoke tests
        run: pnpm test:live:smoke -- --testNamePattern='^(?!.*Juno Pure Devotion)'

      - name: Require the Juno Patchright probe through managed CDP
        if: ${{ env.LIVE_CDP_ENDPOINT != '' }}
        run: pnpm test:live:smoke -- --testNamePattern='Juno Pure Devotion'

      - name: Observe the Juno Patchright probe from the GitHub runner
        if: ${{ env.LIVE_CDP_ENDPOINT == '' }}
        continue-on-error: true
        run: pnpm test:live:smoke -- --testNamePattern='Juno Pure Devotion'

  live-auto-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build project
        run: pnpm build

      - name: Run live browser auto-render gate
        run: pnpm test:live:auto-render

      - name: Generate live eval report
        if: always()
        run: pnpm eval:auto-render > auto-render-report.json

      - name: Upload live eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-render-report
          path: auto-render-report.json
